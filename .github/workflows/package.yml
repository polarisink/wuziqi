name: Package desktop installers

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: Wuziqi
  APP_VERSION: 1.0.0
  MAIN_CLASS: com.example.wuziqi.WuziqiApp
  MAIN_JAR: wuziqi-1.0-SNAPSHOT.jar
  PACKAGE_INPUT_DIR: target/jpackage-input

jobs:
  package-macos-dmg:
    name: macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Resolve app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build jpackage input
        shell: bash
        run: |
          rm -rf "$PACKAGE_INPUT_DIR" target/dist/macos
          mkdir -p "$PACKAGE_INPUT_DIR/lib" target/dist/macos

          mvn -B -DskipTests package
          mvn -B -DincludeScope=runtime dependency:copy-dependencies -DoutputDirectory="$PACKAGE_INPUT_DIR/lib"
          cp "target/$MAIN_JAR" "$PACKAGE_INPUT_DIR/$MAIN_JAR"

      - name: Create DMG
        shell: bash
        run: |
          jpackage \
            --type dmg \
            --name "$APP_NAME" \
            --app-version "$APP_VERSION" \
            --vendor "FXGL" \
            --dest target/dist/macos \
            --input "$PACKAGE_INPUT_DIR" \
            --main-jar "$MAIN_JAR" \
            --main-class "$MAIN_CLASS" \
            --java-options "-Dfile.encoding=UTF-8"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: wuziqi-macos-dmg
          path: target/dist/macos/*.dmg
          if-no-files-found: error

  package-windows-exe:
    name: Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Resolve app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          $wixToolset = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter "WiX Toolset*" |
            Sort-Object Name -Descending |
            Select-Object -First 1

          if ($null -eq $wixToolset) {
            throw "WiX Toolset was not found after installation."
          }

          "$($wixToolset.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build jpackage input
        shell: pwsh
        run: |
          Remove-Item $env:PACKAGE_INPUT_DIR, target\dist\windows -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$env:PACKAGE_INPUT_DIR\lib", target\dist\windows | Out-Null

          mvn -B -DskipTests package
          mvn -B -DincludeScope=runtime dependency:copy-dependencies "-DoutputDirectory=$env:PACKAGE_INPUT_DIR\lib"
          Copy-Item "target\$env:MAIN_JAR" "$env:PACKAGE_INPUT_DIR\$env:MAIN_JAR"

      - name: Create EXE
        shell: pwsh
        run: |
          jpackage `
            --type exe `
            --name "$env:APP_NAME" `
            --app-version "$env:APP_VERSION" `
            --vendor "FXGL" `
            --dest target\dist\windows `
            --input "$env:PACKAGE_INPUT_DIR" `
            --main-jar "$env:MAIN_JAR" `
            --main-class "$env:MAIN_CLASS" `
            --win-menu `
            --win-shortcut `
            --java-options "-Dfile.encoding=UTF-8"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: wuziqi-windows-exe
          path: target/dist/windows/*.exe
          if-no-files-found: error

  publish-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      - package-macos-dmg
      - package-windows-exe
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download packaged installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
